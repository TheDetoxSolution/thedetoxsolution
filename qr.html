<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RC Vending — Refund QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:wght@400;500;600&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F7F5F0; --white: #FFFFFF;
      --forest: #1B3D2A; --forest2: #244D36; --sage: #4A7C5F;
      --ink: #1A1F1B; --muted: #6B7870; --border: #DDE4DE;
    }
    body { background: var(--cream); font-family: 'Figtree', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; -webkit-font-smoothing: antialiased; }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 40px rgba(27,61,42,0.08);
    }

    .logo { font-family: 'Cormorant Garant', serif; font-size: 20px; font-weight: 600; color: var(--forest); margin-bottom: 32px; }

    .qr-wrapper {
      background: var(--white);
      border: 2px solid var(--forest);
      border-radius: 16px;
      padding: 24px;
      display: inline-block;
      margin-bottom: 32px;
    }

    #qrcode img, #qrcode canvas { border-radius: 8px; }

    h2 { font-family: 'Cormorant Garant', serif; font-size: 26px; font-weight: 500; color: var(--ink); margin-bottom: 10px; }

    p { font-size: 14px; color: var(--muted); font-weight: 300; line-height: 1.65; margin-bottom: 32px; }

    .url-box { background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--muted); font-family: monospace; margin-bottom: 32px; }

    .download-btn { display: inline-block; background: var(--forest); color: var(--white); padding: 14px 32px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; border: none; font-family: 'Figtree', sans-serif; transition: background 0.2s; }
    .download-btn:hover { background: var(--forest2); }

    .instructions { margin-top: 32px; padding-top: 28px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); line-height: 1.65; font-weight: 300; }

    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; border: none; }
      .download-btn { display: none; }
      .instructions { display: none; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">RC Vending</div>

  <div class="qr-wrapper">
    <div id="qrcode"></div>
  </div>

  <h2>Scan for a Refund</h2>
  <p>If your product did not dispense or was defective, scan this code to submit a refund request. All refunds are processed within 72 hours.</p>

  <div class="url-box">refund.rcvending.com</div>

  <button class="download-btn" onclick="downloadQR()">Download QR Code</button>

  <div class="instructions">
    Print this page and affix to the front of the machine.<br/>
    For help, call (715) 781-9207
  </div>
</div>

<script>
  const qr = new QRCode(document.getElementById("qrcode"), {
    text: "https://refund.rcvending.com",
    width: 240,
    height: 240,
    colorDark: "#1B3D2A",
    colorLight: "#FFFFFF",
    correctLevel: QRCode.CorrectLevel.H
  });

  function downloadQR() {
    const canvas = document.querySelector("#qrcode canvas");
    if (canvas) {
      const link = document.createElement("a");
      link.download = "rcvending-refund-qr.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }
  }
</script>

  <script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6a28904e41d7d22db18f8b36" data-source="WEB_USER"></script>
</body>
</html>
